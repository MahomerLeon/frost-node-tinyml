# Configuration of ml/prepare_dataset.py, ml/train.py and ml/convert_tflite.py.
# Paths are relative to the repository root.

# Version number N of the output file data/processed/dataset_vN.csv.
# A version is never overwritten: increase the number to build a new one.
dataset_version: 1

paths:
  node_dir: data/raw/node                 # CSV logs downloaded from the node
  ideam_dir: data/raw/public              # the three IDEAM UPTC files
  zenodo_zip: data/raw/public/topoclimatic_graph_dataset_frost_prediction_v1.zip
  zenodo_member: data/altiplano_frost_dataset_core_labeled.csv.gz
  output_dir: data/processed
  models_dir: ml/models                   # trained models and metrics
  firmware_model_headers:                 # every firmware that runs the model
    - firmware/inference/model_data.h       # ESP32-S3 node
    - firmware/pico_benchmark/model_data.h  # Raspberry Pi Pico (R7 comparison)

# Which sources to include. "node" is the own dataset (R4); the other two are
# public support data.
sources:
  node: true
  ideam: true
  zenodo: true

zenodo:
  exclude_stations: [11]   # station excluded on purpose before any use

# ---- Time grid and windows ----
grid_minutes: 30           # common time step of every source
window_hours: 3            # the model sees the last 3 hours
horizon_hours: 6           # the label looks at the next 6 hours
# Gaps are filled by linear interpolation only when the two real readings
# around the gap are at most this far apart. Longer gaps stay empty.
max_interpolation_gap_minutes: 60

# ---- Labeling rule ----
# The class depends on the MINIMUM temperature of the next horizon_hours.
#   num_classes: 2 -> one threshold  [T]:        class 1 (risk) if minimum <= T
#   num_classes: 3 -> two thresholds [Tlow, Thigh]:
#                       class 2 if minimum <= Tlow, class 1 if minimum <= Thigh
#
# Decision of 2026-11-21 (the author asked to choose the most convenient
# option), written in docs/capture_protocol.md:
#   class 0 "no risk"  minimum above 6 C
#   class 1 "caution"  minimum above 2 C and at most 6 C
#   class 2 "risk"     minimum at or below 2 C
# 2 C: the sensors are at 1.5 m; on clear, calm nights the crop surface can be
#      several degrees colder than the air at that height (FAO frost
#      protection, ref. [1] of the proposal), so 2 C in the air is treated as
#      possible frost on the crop.
# 6 C: an operational caution band, NOT an agronomic value. It gives the
#      model examples of cold nights, because nights at or below 2 C are rare
#      in the data (IDEAM UPTC Tunja: 9 days in 2019-2026).
# Both values can be changed here; build a new dataset version if they change.
labeling:
  num_classes: 3
  thresholds_c: [2.0, 6.0]

# ---- Split by whole days ----
# Stratified: days are grouped by the highest class they contain, and each
# group is split 70/15/15 on its own, so the rare cold days appear in train,
# val and test (guidelines, section 5.2).
split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

# ---- Valid periods of the node data ----
# Only node readings inside one of these local-time periods [start, end] are
# used. The raw files are never edited: they also contain the first night
# (BME280 inside the box), indoor tests and the boot readings taken when the
# board is plugged into the PC, which must not enter the dataset. Add one
# period per outdoor capture. null = use every row.
node:
  valid_periods:
    - ["2026-11-21 19:45:00", "2026-11-22 07:40:00"]   # night 2: both sensors outside the box
    - ["2026-11-22 19:40:00", "2026-11-23 08:22:00"]   # night 3: BME280 reads about 1.2 C below the probe

# ---- Calibration of the node temperature ----
# Offset of the BME280 against the DS18B20 probe (BME280 minus probe, in C),
# measured with ml/calibration_report.py when both sensors are together.
# null = no correction. When set, prepare_dataset.py subtracts it from the
# node temperature; the raw files are never changed.
calibration:
  node_temperature_offset_c: null

# ---- Training (ml/train.py) ----
training:
  # Sources used for training and evaluation: any of node, ideam, zenodo.
  # Use [node] to train only with the own dataset.
  sources: [node, ideam, zenodo]
  hidden_units: [16, 8]    # sizes of the two hidden layers; reduce if needed
  max_epochs: 50
  batch_size: 256
  early_stopping_patience: 5
  seed: 42

# ---- Conversion (ml/convert_tflite.py) ----
conversion:
  representative_samples: 500   # train rows used to calibrate the int8 ranges
  device_test_vectors: 100      # test rows exported to validate on the ESP32-S3

# ---- Minimum examples per class ----
# Rule of thumb, not a result: prepare_dataset.py warns when the training
# split has fewer station-days than this for any class (guidelines, 5.2:
# define the minimum number of samples per class in advance).
min_days_per_class_train: 10
